services:
  postgres:
    image: postgres:17-alpine
    container_name: echovocis-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: echovocis
      POSTGRES_PASSWORD: echovocis
      POSTGRES_DB: echovocis
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
