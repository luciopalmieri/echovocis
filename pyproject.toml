[project]
name = "echovocis"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "agno>=1.7.0",
    "openai>=1.90.0",
    "python-telegram-bot[all]>=22.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.16.0",
    "httpx>=0.28.0",
    "pydantic-settings>=2.9.0",
    "cuid2>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.0.0",
    "aiosqlite>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
